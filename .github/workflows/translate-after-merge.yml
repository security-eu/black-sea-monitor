name: Translate existing Black Sea records (manual fallback)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: black-sea-single-update
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translate missing records only
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL_API_URL: ${{ vars.DEEPL_API_URL || 'https://api-free.deepl.com/v2/translate' }}
        run: python scripts/translate_statements.py
      - name: Save cached translations and cumulative quota
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/statements.bg.json data/statements.ro.json data/incidents.bg.json data/incidents.ro.json data/translation_usage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh cached translations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
