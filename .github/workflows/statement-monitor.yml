name: Auto-update Black Sea news and incident leads
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: black-sea-single-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Prepare and retain historical data
        run: python scripts/migrate_and_enrich.py
      - name: Discover new news and statement leads
        run: python scripts/update_statements.py
      - name: Discover incident leads
        run: python scripts/discover_incidents.py
      - name: Validate all published data
        run: python scripts/validate_data.py
      - name: Translate published records with existing shared DeepL budget
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL_API_URL: ${{ vars.DEEPL_API_URL || 'https://api-free.deepl.com/v2/translate' }}
        run: python scripts/translate_statements.py
      - name: Generate public feeds and updated timestamp
        run: python scripts/generate_feeds.py
      - name: Commit published data, translations and quota together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ rss.xml
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update Black Sea data and cached translations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
