name: Auto-update Black Sea news and incident leads
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: black-sea-auto-publish
  cancel-in-progress: false
jobs:
  discover-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Merge legacy records and add sourced historical entries
        run: python scripts/migrate_and_enrich.py
      - name: Discover press and official-statement leads
        run: python scripts/update_statements.py
      - name: Discover maritime incident leads (do not map unsupported positions)
        run: python scripts/discover_incidents.py
      - name: Validate all published records against JSON schemas
        run: python scripts/validate_data.py
      - name: Refresh metadata, RSS and CSV
        run: python scripts/generate_feeds.py
      - name: Commit updates directly to main (no Pull Request)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ rss.xml
          if git diff --cached --quiet; then
            echo 'No new or changed records.'
          else
            git commit -m 'Auto-publish validated Black Sea updates and discovery leads'
            git push origin HEAD:main
          fi
