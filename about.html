<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08141f">
<title>About &amp; methodology · EU Black Sea Monitor</title>
<meta name="description" content="Scope, sources, attribution standards, map accuracy and corrections policy of the EU Black Sea Monitor.">
<link rel="canonical" href="https://security-eu.github.io/black-sea-monitor/about.html">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" id="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".5"/><circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".8"/><circle cx="16" cy="16" r="3.2" fill="currentColor"/><path d="M16 1v6M16 25v6M1 16h6M25 16h6" stroke="currentColor" stroke-width="1.6"/></svg>
    <span class="brand-text"><strong data-i18n="siteName">EU Black Sea Monitor</strong><small data-i18n="tagline"></small></span>
  </a>
  <nav class="lang" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="bg">BG</button><button type="button" data-lang="ro">RO</button></nav>
</header>
<main class="about">
  <a class="back" id="back" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span data-i18n="back">Back to the map</span></a>
  <p class="eyebrow" data-i18n="methodology">Methodology</p>
  <h1 data-i18n="about">About &amp; methodology</h1>
  <p class="lead" data-i18n="aboutIntro"></p>
  <section><h2 data-i18n="aboutScope"></h2><p data-i18n="aboutScopeText"></p><ul class="legend-list" id="cats"></ul></section>
  <section><h2 data-i18n="aboutEvidence"></h2><p data-i18n="aboutEvidenceText"></p></section>
  <section><h2 data-i18n="aboutLocation"></h2><p data-i18n="aboutLocationText"></p></section>
  <section><h2 data-i18n="aboutUpdates"></h2><p data-i18n="aboutUpdatesText"></p><p id="contact" style="margin-top:10px"></p></section>
  <section><h2 data-i18n="aboutEditor"></h2><p data-i18n="aboutEditorText"></p></section>
</main>
<script type="module">
const LANGS=['en','bg','ro'];
const CAT={vessel_strike:'#ff6b5b',mine:'#f4b740',drone_debris:'#b48cff',port_attack:'#ff9548',mine_action:'#8193a6'};
const get=k=>{try{return localStorage.getItem(k)}catch{return null}};
const q=new URLSearchParams(location.search).get('lang');
let lang=LANGS.includes(q)?q:LANGS.includes(get('bsm-lang'))?get('bsm-lang'):'en';
const cfg=await fetch('config.json').then(r=>r.ok?r.json():{}).catch(()=>({}));
async function apply(l){
  lang=l;try{localStorage.setItem('bsm-lang',l)}catch{}
  const t=await fetch(`i18n/${l}.json`).then(r=>r.json());
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t[el.dataset.i18n]??''});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));
  const home=l==='en'?'./':'./?lang='+l;
  document.getElementById('back').href=home;document.getElementById('brand').href=home;
  document.getElementById('cats').innerHTML=Object.entries(CAT).map(([k,c])=>`<li><i class="cdot" style="background:${c}"></i>${t['cat_'+k]}</li>`).join('');
  const box=document.getElementById('contact');box.textContent='';
  if(cfg.corrections_email){const a=document.createElement('a');a.href='mailto:'+cfg.corrections_email;a.textContent=cfg.corrections_email;box.append(t.contactLabel+': ',a)}
  else box.textContent=t.contactPending;
  document.title=`${t.about} · ${t.siteName}`;
  const u=new URL(location.href);if(l==='en')u.searchParams.delete('lang');else u.searchParams.set('lang',l);history.replaceState(null,'',u);
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>apply(b.dataset.lang));
apply(lang);
</script>
</body>
</html>
