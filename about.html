<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>About & methodology — EU Black Sea Maritime Security Monitor</title><meta name="description" content="Editorial scope, evidence and attribution standards, mapping uncertainty, corrections and update policy of the EU Black Sea Maritime Security Monitor."><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css"><style>body{min-height:100dvh}.about-page{max-width:850px;margin:0 auto;padding:25px 20px 90px}.about-page>a{display:inline-block;margin-bottom:20px;color:#83dbea}.about-page h1{font-size:clamp(25px,4vw,40px)}.about-page h2{margin-top:32px;font-size:20px}.about-page p{line-height:1.85;color:#bdcfdc}.about-page section{border-bottom:1px solid #365168;padding-bottom:12px}.back-link{color:#83dbea}</style></head><body><div class="about-page"><a class="back-link" id="back" href="./">← Back to map</a><div class="eyebrow">EU BLACK SEA / MARITIME SECURITY MONITOR</div><h1 id="head">About & methodology</h1><p id="intro"></p><main id="sections"></main><p id="contactNotice"></p></div><script type="module">
const params=new URLSearchParams(location.search);let lang=['en','bg','ro'].includes(params.get('lang'))?params.get('lang'):'en';let r=await fetch('i18n/'+lang+'.json');let t=await r.json();document.documentElement.lang=lang;document.getElementById('back').href='./?lang='+lang;document.getElementById('head').textContent=t.about;document.getElementById('intro').textContent=t.aboutIntro;const fields=[['aboutEditor','aboutEditorText'],['aboutScope','aboutScopeText'],['aboutEvidence','aboutEvidenceText'],['aboutLocation','aboutLocationText'],['aboutUpdates','aboutUpdatesText']];for(const [a,b] of fields){let el=document.createElement('section');let h=document.createElement('h2');h.textContent=t[a];let p=document.createElement('p');p.textContent=t[b];el.append(h,p);document.getElementById('sections').append(el)}const cfg=await fetch('config.json').then(x=>x.json()).catch(()=>({}));const contact=document.getElementById('contactNotice');if(cfg.corrections_email){const a=document.createElement('a');a.href='mailto:'+cfg.corrections_email;a.textContent=cfg.corrections_email;contact.append('Corrections: ',a)}else{contact.textContent='Contact address pending: the site operator must configure a public corrections email.'}
</script></body></html>
